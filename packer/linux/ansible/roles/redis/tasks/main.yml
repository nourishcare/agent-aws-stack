---
- name: Add Redis PPA
  when: install_redis | default(false) | bool
  ansible.builtin.apt_repository:
    repo: ppa:redislabs/redis
    state: present
    update_cache: true

- name: Install Redis server from RedisLabs PPA
  when: install_redis | default(false) | bool
  ansible.builtin.apt:
    pkg:
      - redis-server
    update_cache: true

- name: Enable and start Redis
  when: install_redis | default(false) | bool
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true

- name: Check Redis installation
  when: install_redis | default(false) | bool
  ansible.builtin.shell: |
    redis-server --version
    redis-cli --version
    systemctl is-active redis-server || true
  register: redis_version_check
  changed_when: false

- name: Display Redis version
  when: install_redis | default(false) | bool
  ansible.builtin.debug:
    var: redis_version_check.stdout_lines
