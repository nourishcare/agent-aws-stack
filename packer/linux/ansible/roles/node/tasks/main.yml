---
- name: Add NodeSource GPG key
  when: install_node | default(false) | bool
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /usr/share/keyrings/nodesource.gpg
    mode: '0644'

- name: Add NodeSource repository for Node.js {{ node_major_version | default('20') }}
  when: install_node | default(false) | bool
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major_version | default('20') }}.x {{ ansible_distribution_release }} main"
    state: present

- name: Install Node.js {{ node_major_version | default('20') }}
  when: install_node | default(false) | bool
  ansible.builtin.apt:
    pkg:
      - nodejs
    update_cache: true

- name: Enable corepack (yarn/pnpm shims)
  when: install_node | default(false) | bool
  ansible.builtin.command: corepack enable
  args:
    creates: /usr/local/bin/corepack

- name: Ensure /usr/local/bin and /usr/local/sbin are in PATH for all users
  when: install_node | default(false) | bool
  ansible.builtin.copy:
    dest: /etc/profile.d/99-local-path.sh
    mode: '0755'
    content: |
      case :$PATH: in
        *:/usr/local/bin:*) ;;
        *) export PATH="/usr/local/bin:$PATH" ;;
      esac
      case :$PATH: in
        *:/usr/local/sbin:*) ;;
        *) export PATH="/usr/local/sbin:$PATH" ;;
      esac
